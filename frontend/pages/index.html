<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد - ينمو</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/info-panel.css">
    <link rel="stylesheet" href="styles/form-panel.css">
    <link rel="stylesheet" href="styles/components.css">
</head>

<body>

    <div class="split-layout">

        <div class="form-side">
            <header class="form-header">
                <div class="logo">
                    <img src="assets/logos/sudanese-phoniatric-logo.jpg" alt="Ynmo Logo" class="logo-img">
                </div>
            </header>

            <div class="form-content-wrapper">
                <div class="login-prompt">
                هل لديك حساب؟ <a href="register-login.html">تسجيل الدخول</a>
                </div>

                <div class="step active">
                    <h2 class="step-title">اختر نوع الحساب <span class="asterisk">*</span></h2>

                    <div class="cards-grid" data-account-types-grid></div>

                    <div class="form-actions">
                        <button id="btn-next" class="primary-btn" disabled>التالي</button>
                    </div>
                </div>
            </div>

            <footer class="form-footer">
                <a href="#">الشروط والأحكام</a>
                <span class="separator">|</span>
                <a href="#">ملفات الإرتباط</a>
                <span class="separator">|</span>
                <a href="#">سياسة الخصوصية</a>
                <span class="separator">|</span>
                <span class="copyright">جميع الحقوق محفوظة لـ ينمو © 2026</span>
            </footer>
        </div>

        <div class="info-side">
            <div class="bg-shape"></div>
            <div class="info-content">
                <div class="brand-name">منصة ينمو</div>
                <h1 class="main-heading">
                    يوفر ينمو القدرة على<br>
                    إنشاء وتخصيص<br>
                    المناهج
                </h1>
                <p class="sub-heading">
                    يمكنك المشاركة في مجتمع ينمو، و انشاء مناهج لمساعدة<br>المستفيدين بحسب احتياجاتهم
                </p>
                <div class="laptop-mockup">
                    <img src="https://via.placeholder.com/700x450/ffffff/cccccc?text=Ynmo+Dashboard"
                        alt="Ynmo Dashboard">
                </div>
            </div>
        </div>

    </div>

    <a href="#" class="float-whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script src="js/main.js"></script>
</body>

</html>

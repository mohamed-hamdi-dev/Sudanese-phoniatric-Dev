<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - ينمو</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/info-panel.css">
    <link rel="stylesheet" href="styles/form-panel.css">
    <link rel="stylesheet" href="styles/register.css">
</head>

<body>

    <div class="split-layout">

        <div class="form-side">
            <header class="form-header">
                <div class="logo">
                    <img src="assets/logos/sudanese-phoniatric-logo.jpg" alt="Ynmo Logo" class="logo-img">
                </div>
                <div class="lang-switcher">
                    العربية <i class="fa-solid fa-chevron-down"></i>
                </div>
            </header>

            <div class="form-content-wrapper">
                <div class="login-prompt">
                    ليس لديك حساب؟ <a href="index.html">سجل الآن</a>
                </div>

                <div class="step active">
                    <h2 class="step-title" style="margin-bottom: 20px;">اهلا بعودتك</h2>

                    <form class="register-form">
                        <div class="input-box">
                            <label style="color: #888;">اسم المستخدم/ البريد الإلكتروني <span class="asterisk">*</span></label>
                            <input type="email">
                        </div>

                        <div class="input-box password-box">
                            <label style="color: #888;">كلمة المرور <span class="asterisk">*</span></label>
                            <input type="password">
                            <i class="fa-regular fa-eye eye-icon"></i>
                        </div>

                        <div class="login-actions">
                            <a href="forgot-password.html" class="forgot-link">هل نسيت كلمة المرور؟</a>
                            <label class="remember-check">
                                <input type="checkbox" checked>
                                <span>تذكرني</span>
                            </label>
                        </div>

                        <div class="form-buttons-container">
                            <button type="submit" class="btn-create">تسجيل الدخول</button>
                            <a href="index.html" class="btn-return">
                                الرجوع <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="info-side">
            <div class="bg-shape"></div>
            <div class="info-content">
                <div class="brand-name">منصة ينمو</div>
                <h1 class="main-heading">
                    يوفر ينمو القدرة على<br>
                    إنشاء وتخصيص<br>
                    المناهج
                </h1>
                <p class="sub-heading">
                    يمكنك المشاركة في مجتمع ينمو، و إنشاء مناهج لمساعدة<br>المستفيدين بحسب احتياجاتهم
                </p>
                <div class="laptop-mockup">
                    <img src="https://via.placeholder.com/700x450/ffffff/cccccc?text=Ynmo+Dashboard"
                        alt="Ynmo Dashboard">
                </div>
            </div>
        </div>

    </div>
    <script src="js/permissions.js"></script>
    <script src="js/auth-login.js"></script>
    <script src="js/app-main.js"></script>
</body>

</html>
